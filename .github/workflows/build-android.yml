name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Expo environment
        shell: bash
        run: |
          test -f .env
          SUPABASE_URL_VALUE=$(sed -n 's/^SUPABASE_URL="\(.*\)"$/\1/p' .env | head -n 1)
          SUPABASE_KEY_VALUE=$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env | head -n 1)
          test -n "$SUPABASE_URL_VALUE"
          test -n "$SUPABASE_KEY_VALUE"
          echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL_VALUE" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY_VALUE" >> "$GITHUB_ENV"

      - name: Install React Native dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project with Expo
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitspro-react-native-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rn-apk-latest --yes --cleanup-tag || true
          gh release create rn-apk-latest mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Ignite HabitsPro — React Native APK" \
            --notes "React Native Android debug APK built from ${{ github.ref_name }} at commit ${{ github.sha }}."
          echo "## APK" >> "$GITHUB_STEP_SUMMARY"
          echo "React Native APK was built from branch **${{ github.ref_name }}**." >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/rn-apk-latest" >> "$GITHUB_STEP_SUMMARY"
