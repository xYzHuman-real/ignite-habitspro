name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current app
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify web assets are packaged
        shell: bash
        run: |
          set -e
          test -s dist/index.html
          test -d android/app/src/main/assets/public
          test -s android/app/src/main/assets/public/index.html
          echo "Web assets successfully copied into Android project."

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -e
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitspro-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete android-apk-latest --yes --cleanup-tag || true
          gh release create android-apk-latest android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Ignite HabitsPro — Android APK" \
            --notes "Installable Android APK built from the current main branch at commit ${{ github.sha }}."
          echo "## Android APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Installable APK built from **main** at commit **${{ github.sha }}**." >> "$GITHUB_STEP_SUMMARY"
