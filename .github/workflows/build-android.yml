name: Build React Native Release APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "react-native-migration"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: React Native Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Expo environment
        shell: bash
        run: |
          set -e
          test -f .env
          SUPABASE_URL_VALUE=$(sed -n 's/^SUPABASE_URL="\(.*\)"$/\1/p' .env | head -n 1)
          SUPABASE_KEY_VALUE=$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env | head -n 1)
          test -n "$SUPABASE_URL_VALUE"
          test -n "$SUPABASE_KEY_VALUE"
          printf 'EXPO_PUBLIC_SUPABASE_URL="%s"\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$SUPABASE_URL_VALUE" "$SUPABASE_KEY_VALUE" > mobile/.env

      - name: Install React Native dependencies
        working-directory: mobile
        run: npm install

      - name: Align Expo SDK dependencies
        working-directory: mobile
        run: npx expo install --fix

      - name: Validate Expo project
        working-directory: mobile
        run: npx expo-doctor

      - name: Generate Android project with Expo
        working-directory: mobile
        env:
          CI: 1
          EXPO_PROJECT_ROOT: ${{ github.workspace }}/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Verify Expo Android autolinking
        working-directory: mobile/android
        shell: bash
        run: |
          set -e
          grep -n "expo-autolinking-settings" settings.gradle
          grep -n "expoAutolinking.useExpoModules" settings.gradle
          grep -n "expoAutolinking.useExpoVersionCatalog" settings.gradle

      - name: Verify production JavaScript export
        working-directory: mobile
        run: npx expo export --platform android --clear

      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PROJECT_ROOT: ${{ github.workspace }}/mobile
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify release APK
        shell: bash
        run: |
          set -e
          test -s mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -lh mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitspro-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete rn-release-apk-latest --yes --cleanup-tag || true
          gh release create rn-release-apk-latest mobile/android/app/build/outputs/apk/release/app-release.apk \
            --title "Ignite HabitsPro — React Native Release APK" \
            --notes "Release APK built from branch ${{ inputs.branch }} at commit ${{ github.sha }}."
          echo "## Release APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from branch **${{ inputs.branch }}**." >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/rn-release-apk-latest" >> "$GITHUB_STEP_SUMMARY"
