name: Build React Native Debug APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "react-native-migration"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: React Native Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Expo environment
        shell: bash
        run: |
          set -e
          test -f .env
          SUPABASE_URL_VALUE=$(sed -n 's/^SUPABASE_URL="\(.*\)"$/\1/p' .env | head -n 1)
          SUPABASE_KEY_VALUE=$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env | head -n 1)
          test -n "$SUPABASE_URL_VALUE"
          test -n "$SUPABASE_KEY_VALUE"
          printf 'EXPO_PUBLIC_SUPABASE_URL="%s"\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$SUPABASE_URL_VALUE" "$SUPABASE_KEY_VALUE" > mobile/.env

      - name: Install React Native dependencies
        working-directory: mobile
        run: npm install

      - name: Align Expo SDK dependencies
        working-directory: mobile
        run: npx expo install --fix

      - name: Validate Expo project
        working-directory: mobile
        run: npx expo-doctor

      - name: Validate production JavaScript bundle
        working-directory: mobile
        run: npx expo export --platform android --clear

      - name: Generate Android project with Expo
        working-directory: mobile
        env:
          CI: 1
          EXPO_PROJECT_ROOT: ${{ github.workspace }}/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Verify Expo Android autolinking
        working-directory: mobile/android
        shell: bash
        run: |
          set -e
          grep -n "expo-autolinking-settings" settings.gradle
          grep -n "expoAutolinking.useExpoModules" settings.gradle
          grep -n "expoAutolinking.useExpoVersionCatalog" settings.gradle

      - name: Package Expo Router JS bundle into debug APK
        working-directory: mobile
        env:
          CI: 1
          EXPO_PROJECT_ROOT: ${{ github.workspace }}/mobile
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          rm -f android/app/src/main/assets/index.android.bundle
          npx expo export:embed \
            --platform android \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --dev false
          test -s android/app/src/main/assets/index.android.bundle
          echo "Bundled JS size: $(wc -c < android/app/src/main/assets/index.android.bundle) bytes"

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitspro-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish debug APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release delete rn-debug-apk-latest --yes --cleanup-tag || true
          gh release create rn-debug-apk-latest mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Ignite HabitsPro — React Native Debug APK" \
            --notes "Debug APK built from branch ${{ inputs.branch }} at commit ${{ github.sha }}."
          echo "## Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from branch **${{ inputs.branch }}**." >> "$GITHUB_STEP_SUMMARY"
          echo "Release: https://github.com/${{ github.repository }}/releases/tag/rn-debug-apk-latest" >> "$GITHUB_STEP_SUMMARY"
