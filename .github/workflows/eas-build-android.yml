name: Build Android APK with EAS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to build"
        required: true
        default: "react-native-migration"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: EAS Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN GitHub secret is required."
            exit 1
          fi
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Prepare Expo environment
        shell: bash
        run: |
          test -f .env
          SUPABASE_URL_VALUE=$(sed -n 's/^SUPABASE_URL="\(.*\)"$/\1/p' .env | head -n 1)
          SUPABASE_KEY_VALUE=$(sed -n 's/^SUPABASE_PUBLISHABLE_KEY="\(.*\)"$/\1/p' .env | head -n 1)
          test -n "$SUPABASE_URL_VALUE"
          test -n "$SUPABASE_KEY_VALUE"
          echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL_VALUE" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY_VALUE" >> "$GITHUB_ENV"
          printf 'EXPO_PUBLIC_SUPABASE_URL="%s"\nEXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="%s"\n' "$SUPABASE_URL_VALUE" "$SUPABASE_KEY_VALUE" > mobile/.env
      - name: Install React Native dependencies
        working-directory: mobile
        run: npm install
      - name: Align Expo SDK dependencies
        working-directory: mobile
        run: npx expo install --fix
      - name: Initialize/link EAS project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --force --non-interactive
      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: 1
          EXPO_PROJECT_ROOT: ${{ github.workspace }}/mobile
        run: npx expo prebuild --platform android --clean --non-interactive
      - name: Verify Expo Android autolinking
        working-directory: mobile/android
        shell: bash
        run: |
          set -e
          grep -n "expo-autolinking-settings" settings.gradle
          grep -n "expoAutolinking.useExpoModules" settings.gradle
          grep -n "expoAutolinking.useExpoVersionCatalog" settings.gradle
      - name: Print native startup configuration
        working-directory: mobile/android
        shell: bash
        run: |
          set -e
          echo '===== settings.gradle ====='
          cat settings.gradle
          echo '===== app/build.gradle ====='
          cat app/build.gradle
          echo '===== AndroidManifest.xml ====='
          cat app/src/main/AndroidManifest.xml
          echo '===== MainActivity ====='
          find app/src/main -type f \( -name 'MainActivity.*' -o -name 'MainApplication.*' \) -print -exec cat {} \;
      - name: Build native Android project locally
        working-directory: mobile/android
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Build Android APK on EAS
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ROOT: ${{ github.workspace }}/mobile
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --clear-cache --wait
