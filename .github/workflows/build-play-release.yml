name: Build Play Store bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build packaged web app
        run: npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          cat >> android/app/build.gradle <<'EOF'
          def releaseKeystoreProperties = new Properties()
          def releaseKeystorePropertiesFile = rootProject.file("keystore.properties")
          releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))

          android {
              signingConfigs {
                  release {
                      storeFile file(releaseKeystoreProperties["storeFile"])
                      storePassword releaseKeystoreProperties["storePassword"]
                      keyAlias releaseKeystoreProperties["keyAlias"]
                      keyPassword releaseKeystoreProperties["keyPassword"]
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed Android App Bundle
        working-directory: android
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ignite-habitpro-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
