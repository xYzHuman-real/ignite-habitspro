name: Build React Native Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build native Android release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout verified React Native migration
        uses: actions/checkout@v4
        with:
          ref: rn-migration-verified

      - name: Verify source projects
        shell: bash
        run: |
          set -euo pipefail
          test -s ../package.json
          test -s ../package-lock.json
          test -s ../src/App.tsx
          test -s package.json
          test -s app.json
          test -s app/_layout.tsx
          test -s app/index.tsx
          echo "Verified original webapp and native shell sources."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build the original webapp
        working-directory: .
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build -- --base ./
          test -s dist/index.html
          echo "Original webapp built successfully."
          find dist -maxdepth 2 -type f | sed -n '1,80p'

      - name: Install native shell dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck native shell
        run: npx tsc --noEmit

      - name: Generate clean Android project
        env:
          CI: 1
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Bundle original webapp into Android assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R ../dist/. android/app/src/main/assets/www/
          test -s android/app/src/main/assets/www/index.html
          echo "Bundled original webapp into native APK assets."
          du -sh android/app/src/main/assets/www

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle
          test -s android/gradlew
          test -x android/gradlew
          test -s android/app/build.gradle
          test -s android/app/src/main/assets/www/index.html
          echo "Generated Android Gradle project and web bundle verified."

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitspro-react-native-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete react-native-apk-latest --yes --cleanup-tag || true
          gh release create react-native-apk-latest mobile/android/app/build/outputs/apk/release/app-release.apk \
            --title "Ignite HabitsPro — Android APK" \
            --notes "Native Android shell bundling the original Ignite HabitsPro webapp UI and functionality."
