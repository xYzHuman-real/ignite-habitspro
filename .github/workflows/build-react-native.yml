name: Build React Native Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build native Android release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout verified React Native migration
        uses: actions/checkout@v4
        with:
          ref: rn-migration-verified

      - name: Verify React Native project exists
        shell: bash
        run: |
          set -euo pipefail
          test -s package.json
          test -s app.json
          test -s app/_layout.tsx
          test -s app/index.tsx
          echo "Verified rn-migration-verified source."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Supabase environment
        shell: bash
        run: |
          set -euo pipefail
          test -s ../.env
          cp ../.env .env
          grep -q '^SUPABASE_URL=' .env
          grep -q '^SUPABASE_PUBLISHABLE_KEY=' .env
          SUPABASE_URL_VALUE="$(grep '^SUPABASE_URL=' .env | head -n 1 | cut -d '=' -f 2- | sed 's/^"//;s/"$//')"
          SUPABASE_KEY_VALUE="$(grep '^SUPABASE_PUBLISHABLE_KEY=' .env | head -n 1 | cut -d '=' -f 2- | sed 's/^"//;s/"$//')"
          test -n "$SUPABASE_URL_VALUE"
          test -n "$SUPABASE_KEY_VALUE"
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL_VALUE"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY_VALUE"
          } >> "$GITHUB_ENV"
          echo "Supabase environment prepared successfully."

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate clean Android project
        env:
          CI: 1
        run: |
          set -euo pipefail
          rm -rf android
          npx expo prebuild --platform android --clean --no-install

      - name: Verify generated Android project
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle
          test -s android/gradlew
          test -x android/gradlew
          test -s android/app/build.gradle
          echo "Generated Android Gradle project successfully."
          ls -la android | sed -n '1,80p'

      - name: Build release APK
        run: ./android/gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ignite-habitspro-react-native-release
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete react-native-apk-latest --yes --cleanup-tag || true
          gh release create react-native-apk-latest mobile/android/app/build/outputs/apk/release/app-release.apk \
            --title "Ignite HabitsPro — React Native Android APK" \
            --notes "Release APK built from rn-migration-verified."
